# Self-host the Long-Term Value Screener.
#
#   cp .env.example .env      # (optional) add SEC_EDGAR_UA / SimFin / Anthropic keys
#   docker compose up -d      # web UI at http://localhost:8000
#
# Add the weekly auto-screen (opt-in):
#   docker compose --profile scheduler up -d
#
services:
  app:
    build: .
    image: value-screener
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fair-access contact for SEC EDGAR — set yours in .env.
      SEC_EDGAR_UA: ${SEC_EDGAR_UA:-value-screener self-hosted}
      TZ: ${TZ:-UTC}
    volumes:
      # Persist watchlist, weekly track record, and dated reports on the host.
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  # Optional: runs weekly_screen.py --scope large on a weekly schedule.
  # Cross-platform replacement for the macOS launchd job. Enable with:
  #   docker compose --profile scheduler up -d
  scheduler:
    build: .
    image: value-screener
    profiles: ["scheduler"]
    command: ["python", "scheduler.py"]
    env_file:
      - path: .env
        required: false
    environment:
      SEC_EDGAR_UA: ${SEC_EDGAR_UA:-value-screener self-hosted}
      TZ: ${TZ:-UTC}
      SCREEN_SCOPE: ${SCREEN_SCOPE:-large}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-8}     # local hour (respects TZ)
      SCHEDULE_WEEKDAY: ${SCHEDULE_WEEKDAY:-0} # 0=Mon … 6=Sun
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
